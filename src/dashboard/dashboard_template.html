<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд сети клиник, 2025</title>
<style>
:root{--bg:#f3f4f2;--panel:#fff;--ink:#1c2430;--mute:#5d6877;--line:#d9dcd8;--ok:#1d7a63;--miss:#b4690e;--bad:#b23b3b;--okbg:#e2f1ec;--missbg:#f8ecd9;--badbg:#f6e1e1;
--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14191f;--panel:#1c232b;--ink:#e6e9ec;--mute:#9aa5b1;--line:#323b46;--ok:#4cc0a0;--miss:#e0a04a;--bad:#e27b7b;--okbg:#17332b;--missbg:#3a2d17;--badbg:#3b1f1f}}
:root[data-theme=dark]{--bg:#14191f;--panel:#1c232b;--ink:#e6e9ec;--mute:#9aa5b1;--line:#323b46;--ok:#4cc0a0;--miss:#e0a04a;--bad:#e27b7b;--okbg:#17332b;--missbg:#3a2d17;--badbg:#3b1f1f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
header{padding:20px 24px 0;max-width:1100px;margin:0 auto}
h1{font:600 24px/1.2 var(--serif);margin:0 0 4px}h2{font:600 20px/1.25 var(--serif);margin:0 0 8px}h3{font:600 16px var(--sans);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:9px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ok);font-weight:600}
nav button:focus-visible{outline:2px solid var(--ok);outline-offset:-2px}
main{max-width:1100px;margin:0 auto;padding:20px 24px 48px}
.stub{border:1px dashed var(--line);border-radius:8px;padding:28px;color:var(--mute);background:var(--panel)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.run{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.run.first{border-top:4px solid var(--miss)}.run.second{border-top:4px solid var(--ok)}
.tag{font-size:13px;color:var(--mute);margin-bottom:8px}
.big{font:600 40px/1 var(--serif)}.big small{font:400 15px var(--sans);color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:10px;font-size:14px}.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%}
.note{background:var(--missbg);border-left:4px solid var(--miss);padding:10px 14px;border-radius:4px;margin:14px 0;font-size:14px}
.okbox{background:var(--okbg);border-left:4px solid var(--ok);padding:10px 14px;border-radius:4px;margin:14px 0;font-size:14px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mute);background:var(--bg)}tr:last-child td{border-bottom:0}
.m{display:inline-block;min-width:76px;text-align:center;border-radius:4px;padding:1px 8px;font-size:13px;font-weight:600}
.m.y{background:var(--okbg);color:var(--ok)}.m.n{background:var(--missbg);color:var(--miss)}
.sub2{color:var(--mute);font-size:13px}
#theme{float:right;background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
@media print{nav,#theme{display:none}.tab{display:block!important}body{background:#fff}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}@media(max-width:720px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.kpi .big{font-size:32px}.neg{color:var(--bad)}.pos{color:var(--ok)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 12px 6px;margin:12px 0}.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:11px var(--sans)}.legend{font-size:13px;color:var(--mute);margin:0 0 4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:baseline}
</style>
</head>
<body>
<header>
<button id="theme" type="button">Тема</button>
<h1>Сеть клиник: управленческая отчётность 2025</h1>
<p class="sub">Данные синтетические: цифры показывают метод, а не реальную эффективность клиник.</p>
<nav role="tablist" id="nav"></nav>
</header>
<main id="main"></main>
<script>
const D=/*DATA*/null;
const TABS=[["overview","Обзор"],["pnl","P&L и план-факт"],["cash","Деньги"],["doctors","Врачи"],["patients","Пациенты и прогноз"],["quality","Качество данных"],["about","О данных"]];
const pct=(a,b)=>Math.round(100*a/b);
const $=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild};
function stub(name,what){return `<h2>${name}</h2><div class="stub">Вкладка в работе. Будет: ${what}</div>`}
function runCard(cls,tag,hash,found,sub,rows,color){
  return `<div class="run ${cls}"><div class="tag">${tag}</div>
  <div class="big">${found}<small> из 14 ошибок найдено</small></div>
  <div class="bar" aria-hidden="true"><i style="width:${pct(found,14)}%;background:${color}"></i></div>
  <div class="kv">${rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join("")}</div>
  <p class="sub2">Версия правил: ${hash}</p></div>`}
function quality(){
  const r1=D.run1,r2=D.run2,E=D.errors;
  const nf=E.filter(e=>!e.first).map(e=>e.id).join(", ");
  const tr=E.map(e=>`<tr><td>${e.id}</td><td>${e.name}</td><td>${e.subtle?"тонкая":"обычная"}</td>
   <td><span class="m ${e.first?"y":"n"}">${e.first?"найдена":"пропущена"}</span></td>
   <td><span class="m y">найдена</span></td>
   <td class="sub2">${e.first?(e.cause==="да"?"причина названа":"только симптом (расхождение поступлений)"):"проверки не было"}</td></tr>`).join("");
  return `<h2>Качество данных</h2>
  <p class="sub">Сверка ERP с 1С: на основном наборе ошибок найдено ${D.recon.found}, остаток после исправлений ${D.recon.residual}. Ниже проверка того, умеет ли сверка находить ошибки, которых автор правил не закладывал.</p>
  <h3>Проверка сверки на втором наборе ошибок, два прогона рядом</h3>
  <p class="sub2">Набор из 14 ошибок написан отдельно от автора правил, по схеме данных. Это второй набор, внесённый вне автора правил, а не независимая проверка.</p>
  <div class="cols">
   ${runCard("first","Первый прогон: слепой, правила заморожены",D.hash1,D.found1,"",[
     ["Тонких найдено",D.subtle_found+" из 6"],["Обычных найдено",D.plain_found+" из 8"],
     ["Находок-первопричин",r1.findings],["Из них верных",r1.correct+" ("+pct(r1.correct,r1.findings)+"%)"],["Ложных",r1.false],
     ["Безобидных расхождений без срабатывания",r1.harmless+" из 12"]],"var(--miss)")}
   ${runCard("second","Повторный прогон: после доработки правил, не слепой",D.hash2,14,"",[
     ["Тонких найдено","6 из 6"],["Обычных найдено","8 из 8"],
     ["Находок-первопричин",r2.findings],["Из них верных",r2.correct+" (100%)"],["Ложных",r2.false],
     ["Безобидных расхождений без срабатывания",r2.harmless+" из 12"]],"var(--ok)")}
  </div>
  <div class="note"><b>Как читать.</b> Первый результат (${D.found1} из 14) это честная оценка на ошибках, которых правила не видели. Второй (14 из 14) показывает, что известные дыры закрыты и что новые правила не шумят на чистых данных и на первом наборе. Правки написаны после того, как ключ был известен, поэтому второй результат не доказывает обобщаемость. Третий набор ошибок не делался.</div>
  <h3>Что было пропущено в первом прогоне и закрыто доработкой</h3>
  <p>${nf}: комиссия эквайринга против ставки, врач против клиники визита, ставка зарплаты против справочника врачей, распределение затрат по направлениям. Проверок на эти случаи в сверке не было. Два ложных срабатывания (сдвиг банковской выписки на день и на выходные) сняты правилом сдвига дат.</p>
  <h3>По каждой ошибке</h3>
  <div class="tw"><table><thead><tr><th>№</th><th>Ошибка</th><th>Тип</th><th>Первый прогон</th><th>Повторный</th><th>Что показала сверка в первом</th></tr></thead><tbody>${tr}</tbody></table></div>
  <div class="okbox"><b>Что ещё не сделано.</b> У четырёх найденных ошибок (E04, E05, E08, E14) найден симптом, а причина не названа. Ставка эквайринга берётся из данных (самая частая по сети), договора в данных нет. Проверка материалов проверена на синтетике, на реальных данных допуск нужно калибровать.</div>`}
const VIEW={
 overview,
 pnl,
 cash,
 doctors,
 patients,
 quality,
 about:()=>`<h2>О данных</h2><p>Данные синтетические, сгенерированы скриптами проекта; цифры показывают работу метода, а не реальную эффективность клиник. Допущения перечислены в <code>docs/ASSUMPTIONS.md</code>, процесс закрытия месяца в <code>docs/REGLAMENT.md</code>, слепой тест сверки в <code>docs/BLIND_RESULT.md</code>.</p>
  <p>Материалы: <a href="https://poliduris1977.github.io/clinic-ai-analyst-public1/one-pager.html">одностраничник</a> · <a href="https://poliduris1977.github.io/clinic-ai-analyst-public1/project.html">описание проекта</a> · <a href="https://github.com/Poliduris1977/clinic-ai-analyst-public1">код на GitHub</a>.</p>
  <p>Версия правил сверки: ${D.hash2} (первый слепой прогон: ${D.hash1}).</p><p class="sub2">Налоги на прибыль, НДС и дивиденды в модели не планируются: остаток денег везде «до налогов и дивидендов».</p>`};
const fm=v=>(v/1e6).toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1});
const MN=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function svgChart(series,opt={}){ // series: [{v:[...],c:css color,k:"bar"|"line"}]
  const W=700,H=210,L=44,B=24,T=8,n=series[0].v.length,all=series.flatMap(s=>s.v);
  let lo=Math.min(0,...all),hi=Math.max(0,...all);if(hi===lo)hi=lo+1;const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),x=i=>L+(W-L-6)*(i+.5)/n,bw=(W-L-6)/n*.55;
  let g="";for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toFixed(0)}</text>`}
  g+=(opt.labels||MN).map((m,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${m}</text>`).join("");
  for(const s of series){ if(s.k==="bar") g+=s.v.map((v,i)=>`<rect x="${x(i)-bw/2}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.abs(y(v)-y(0))}" fill="${s.c}" rx="1"/>`).join("");
    else g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${s.v.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.alt||""}">${g}</svg>`}
const dev=(a,b)=>{const d=(b-a)/Math.abs(a)*100;return (d>0?"+":"−")+Math.abs(d).toFixed(1).replace(".",",")+"%"};
function kpi(name,pf,note){const [p,f]=pf,bad=f<p;return `<div class="kpi"><div class="tag">${name}</div><div class="big">${fm(f)}<small> млн ₽</small></div>
  <div class="kv"><span>План</span><span>${fm(p)}</span><span>Отклонение</span><span class="${bad?"neg":"pos"}">${fm(f-p)} (${dev(p,f)})</span></div><p class="sub2">${note||""}</p></div>`}
function overview(){const o=D.ov,dr=o.rev[1]-o.rev[0],dp=o.prof[1]-o.prof[0],dc=dp-dr;
  const top=o.top.map(([n,v])=>`<tr><td>${n}</td><td style="text-align:right" class="${v<0?"neg":"pos"}">${fm(v)}</td></tr>`).join("");
  return `<h2>Обзор: факт против плана</h2>
  <p>Выручка ниже плана на ${fm(-dr)} млн ₽, прибыль до налога на ${fm(-dp)} млн ₽. Расходы оказались ниже плана на ${fm(dc)} млн ₽ и компенсировали недобор выручки лишь частично.</p>
  <div class="kpis">${kpi("Выручка",o.rev,"По данным 1С")}${kpi("Прибыль до налога",o.prof,"Налог на прибыль и дивиденды в модели не планируются")}${kpi("Остаток денег на конец года",o.cash,"До налогов, НДС и дивидендов: реальный остаток ниже")}</div>
  <div class="chart"><h3>Выручка по месяцам, млн ₽</h3><p class="legend"><span class="sw" style="background:var(--ok)"></span>факт<span class="sw" style="background:var(--miss)"></span>план</p>
  ${svgChart([{v:o.rev_f,c:"var(--ok)",k:"bar"},{v:o.rev_p,c:"var(--miss)",k:"line"}],{alt:"Выручка по месяцам, факт и план"})}</div>
  <div class="chart"><h3>Влияние отклонений на прибыль по месяцам, млн ₽</h3><p class="legend">Минус означает, что месяц снизил прибыль относительно плана.</p>
  ${svgChart([{v:o.prof_imp,c:"var(--bad)",k:"bar"}],{alt:"Влияние на прибыль по месяцам"})}</div>
  <div class="chart"><h3>Остаток денег на конец месяца, млн ₽</h3><p class="legend"><span class="sw" style="background:var(--ok)"></span>факт<span class="sw" style="background:var(--miss)"></span>план</p>
  ${svgChart([{v:o.cash_f,c:"var(--ok)",k:"line"},{v:o.cash_p,c:"var(--miss)",k:"line"}],{alt:"Остаток денег, факт и план"})}</div>
  <h3>Четыре самых больших отклонения, влияние на прибыль, млн ₽</h3><div class="tw"><table><tbody>${top}</tbody></table></div>
  <div class="okbox"><b>Статус данных.</b> Выручка и затраты из книг 1С после исправлений сверки (14 из 14 найдено, остаток ${D.recon.residual}). Подробности на вкладке «Качество данных». Данные синтетические.</div>`}
const fk=v=>Math.abs(v)<0.5?"0":Math.abs(v)<1e6?(v<0?"−":"+")+Math.round(Math.abs(v)/1e3)+" тыс.":(v<0?"−":"+")+fm(Math.abs(v));
function waterfall(items){const W=700,LW=250,RH=24,H=items.length*RH+24,x0=LW+10;let run=0;const seg=[];
  items.forEach(it=>{if(it.k==="t"){run=it.v;seg.push([null,it.v,it])}else{seg.push([run,run+it.v,it]);run+=it.v}});
  const all=seg.flatMap(s=>[s[0]===null?items[0].v:s[0],s[1]]),lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*.15,a=lo-pad,b=hi+pad,x=v=>x0+(W-x0-70)*(v-a)/(b-a);
  const g=seg.map((s,i)=>{const it=s[2],y=i*RH+4,from=s[0]===null?a:s[0],xa=x(Math.min(from,s[1])),xb=x(Math.max(from,s[1])),col=it.k==="t"?"var(--mute)":(it.v<0?"var(--bad)":"var(--ok)");
    return `<text x="${LW}" y="${y+13}" text-anchor="end">${it.n}</text><rect x="${xa}" y="${y+2}" width="${Math.max(xb-xa,1.5)}" height="${RH-9}" fill="${col}" rx="1"/><text x="${xb+5}" y="${y+13}">${it.k==="t"?fm(it.v):fk(it.v)}</text>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Мост валовой маржи от плана к факту">${g}</svg>`}
function pnl(){const p=D.pnl,br=p.bridge,eff=br.filter(i=>i.k==="d"),neg=[...eff].sort((a,b)=>a.v-b.v).slice(0,2);
  const rows=p.rows.map(r=>r.head?`<tr><td colspan="4"><b>${r.n}</b></td></tr>`:`<tr><td style="padding-left:${r.tot?10:24}px">${r.tot?`<b>${r.n}</b>`:r.n}</td><td style="text-align:right">${fm(r.p)}</td><td style="text-align:right">${fm(r.f)}</td><td style="text-align:right" class="${r.imp<0?"neg":(r.imp>0?"pos":"")}">${r.imp?fk(r.imp):"0,0"}</td></tr>`).join("");
  return `<h2>P&L и план-факт</h2>
  <p>Валовая маржа ниже плана на ${fm(br[0].v-br[br.length-1].v)} млн ₽. Сильнее всего её снизили «${neg[0].n.toLowerCase()}» (${fk(neg[0].v)} млн ₽) и «${neg[1].n.toLowerCase()}» (${fk(neg[1].v)} млн ₽).</p>
  <div class="chart"><h3>Мост валовой маржи: план → факт, млн ₽</h3><p class="legend">Ось начинается не с нуля: иначе мелкие эффекты не видны. Зелёное выгодно для маржи, красное нет.</p>${waterfall(br)}</div>
  <div class="note"><b>Что не доказано.</b> Скидки уменьшили маржу на ${fm(-eff.find(e=>/скидк/i.test(e.n)).v)} млн ₽, но в данных нет связи скидок с потоком пациентов, поэтому вывод «скидки не окупились» или «отмена скидок вернёт маржу» из них не следует. Решение по скидкам за коммерческим директором.</div>
  <h3>План-факт по статьям, млн ₽</h3><p class="sub2">Влияние на прибыль: плюс выгодно (выручка выше плана или расход ниже плана).</p>
  <div class="tw"><table><thead><tr><th>Статья</th><th style="text-align:right">План</th><th style="text-align:right">Факт</th><th style="text-align:right">Влияние на прибыль</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="okbox"><b>Статус данных.</b> Таблица построена по книгам 1С, мост по данным ERP. Валовая прибыль в них различается на ${Math.round(p.gap)} ₽: это остаточная разница сверки (−96 ₽) и округление взносов. Фильтров по клинике и направлению в этой версии нет.</div>`}

const CUM=[0,31,59,90,120,151,181,212,243,273,304,334];
function dailyChart(v,imin,dlab){const W=700,H=210,L=44,B=24,T=14,n=v.length,hi=Math.max(...v)*1.05,y=x=>T+(H-T-B)*(1-x/hi),xx=i=>L+(W-L-8)*i/(n-1);
  let g="";for(let k=0;k<=4;k++){const a=hi*k/4;g+=`<line x1="${L}" x2="${W}" y1="${y(a)}" y2="${y(a)}" stroke="var(--line)"/><text x="${L-5}" y="${y(a)+4}" text-anchor="end">${(a/1e6).toFixed(0)}</text>`}
  g+=CUM.map((d,i)=>`<text x="${xx(d)}" y="${H-7}">${MN[i]}</text>`).join("");
  g+=`<polyline fill="none" stroke="var(--ok)" stroke-width="2" points="${v.map((a,i)=>xx(i).toFixed(1)+","+y(a).toFixed(1)).join(" ")}"/>`;
  const lx=xx(imin),anc=lx>W-170?"end":"start",tx=anc==="end"?lx-8:lx+8;

  <div class="chart"><h3>Накопленная выручка на пациента, тыс. ₽ (по месяцам после первого визита)</h3><p class="legend">${pick.map(c=>`<span class="sw" style="background:${c.c}"></span>${c.n}`).join("")}</p>${cohortChart(pick)}</div>
  <p class="sub2">Показано только наблюдённое: данные заканчиваются 31.12.2025, поэтому у поздних когорт кривые короче. Прогноза LTV нет.</p>
  <h3>Все когорты, накопленная выручка на пациента, ₽</h3><p class="sub2">Колонки: месяцы после первого визита (1 = месяц первого визита).</p>
  <div class="tw"><table><thead><tr><th>Когорта</th><th style="text-align:right">Пациентов</th>${Array.from({length:12},(_,i)=>`<th style="text-align:right">${i+1}</th>`).join("")}</tr></thead><tbody>${ct}</tbody></table></div>
  <div class="note"><b>Что не доказано.</b> «Пул» на последних возрастах собран из меньшего числа когорт разных сезонов и не является единой кривой жизни пациента: LTV за 12 месяцев известен только по январской когорте. Срезы ниже сравниваются на одном возрасте (${P.k+1}-й месяц, когорты января-${MA[P.kc-1]}). Канал «Повторное обращение» для нового пациента странная метка, оставлена как в источнике.</div>
  ${slt("По направлению первого визита",P.sl.dir)}${slt("По клинике первого визита",P.sl.cl)}${slt("По каналу привлечения",P.sl.ch)}
  <p class="sub2">Между каналами LTV различается мало (${fR(chmin)} – ${fR(chmax)} ₽), между направлениями сильно (${fR(dmin_)} – ${fR(dmax_)} ₽); доля вернувшихся от ${pc(rmin)} до ${pc(rmax)}. Причины различий по направлениям в данных не разбирались: нужны цены услуг и повторные визиты по видам услуг.</p>
  <h2 style="margin-top:22px">Прогноз выручки на январь-март 2026</h2>
  <div class="chart"><h3>Выручка сети по месяцам, млн ₽: факт 2025 и прогноз</h3><p class="legend"><span class="sw" style="background:var(--ok)"></span>факт<span class="sw" style="background:var(--miss)"></span>прогноз (тренд с затуханием, без сезонности)</p>
  ${svgChart([{v:fact,c:"var(--ok)",k:"bar"},{v:fore,c:"var(--miss)",k:"bar"}],{labels:[...MN,"янв’26","фев’26","мар’26"],alt:"Выручка сети по месяцам, факт и прогноз"})}</div>
  <div class="tw"><table><thead><tr><th>Направление</th><th style="text-align:right">IV кв. 2025 факт</th><th style="text-align:right">I кв. 2026 прогноз</th><th style="text-align:right">К IV кварталу</th><th style="text-align:right">Коридор, млн ₽</th><th style="text-align:right">Ошибка отката</th><th>Надёжность</th></tr></thead><tbody>${ft}</tbody></table></div>
  <div class="note"><b>Как читать.</b> Коридор равен прогнозу ± средней ошибке отката по направлению; коридор итога считается по ошибке отката самого итога (±20%), а не суммой коридоров направлений. Прогнозы по направлениям с низкой надёжностью (${low.map(r=>r.n.toLowerCase()).join(", ")}) нельзя использовать как план. Итог по сети имеет «среднюю» надёжность, но почти половина его суммы собрана из этих направлений. В откате прогноз в среднем занижал факт, поэтому риск по верхней границе больше, чем по нижней.</div>
  <h3>Проверка методов на 2025 годе (откат)</h3><p class="sub2">Обучение по первым 6-9 месяцам, прогноз трёх следующих. Ошибка по модулю усреднена по 72 наблюдениям, они зависимы: оценка ориентировочная.</p>
  <div class="tw"><table><thead><tr><th>Метод</th><th style="text-align:right">Средняя абсолютная ошибка</th><th style="text-align:right">Среднее смещение (факт выше прогноза)</th></tr></thead><tbody>${mt}</tbody></table></div>
  <div class="okbox"><b>Статус данных.</b> Это прогноз по тренду одного года данных, а не бюджет: сезонность по одному году отделить от роста бизнеса нельзя, найм, цены и загрузка кабинетов не учтены. Параметры метода (α=0,5, β=0,3, φ=0,9) не подбирались по данным. Прогноз по врачам, сезонная поправка и изменение параметров остаются в книге <code>Forecast_2026Q1.xlsx</code>. Данные синтетические.</div>`}

function stressCalc(scope,delay,res){const S=D.cash.stress,cls=scope==="Все"?Object.keys(S.cl):[scope],n=S.mon.length,net=Array(n).fill(0),out=Array(n).fill(0),ins=Array(n).fill(0);
  let open=0;cls.forEach(c=>{open+=S.open[c];for(let i=0;i<n;i++){net[i]+=S.cl[c].net[i];out[i]+=S.cl[c].out[i];ins[i]+=S.cl[c].ins[i]}});
  const P=[0];for(let i=0;i<n;i++)P.push(P[i]+ins[i]);const bal=[],st=[];let run=open;
  for(let i=0;i<n;i++){run+=net[i];bal.push(run);st.push(run-(delay>0?P[i+1]-P[Math.max(0,i-delay+1)]:0))}
  const months=[];for(let k=0;k<12;k++){let mf=Infinity,ms=Infinity,so=0,c=0;for(let i=0;i<n;i++)if(S.mon[i]===k){mf=Math.min(mf,bal[i]);ms=Math.min(ms,st[i]);so+=out[i];c++}
    const ao=-so/c,sts=(v,d)=>v<0?"разрыв":(d<res?"ниже резерва":"ок");months.push({mf,ms,df:mf/ao,ds:ms/ao,sf:sts(mf,mf/ao),ss:sts(ms,ms/ao)})}
  const im=a=>a.indexOf(Math.min(...a));
  return {bal,st,months,minS:Math.min(...st),iS:im(st),minF:Math.min(...bal),iF:im(bal),daysS:Math.min(...months.map(m=>m.ds)),
    bad:months.filter(m=>m.ss!=="ок").length,gap:months.filter(m=>m.ss==="разрыв").length,badF:months.filter(m=>m.sf!=="ок").length}}
function firstDelay(scope,res,pred){for(let d=0;d<=365;d++){if(pred(stressCalc(scope,d,res)))return d}return null}
const dlab=i=>{const d=new Date(Date.UTC(2025,0,1+i));return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")};
const stpill=s=>`<span class="m ${s==="ок"?"y":"n"}" style="${s==="разрыв"?"background:var(--badbg);color:var(--bad)":""}">${s}</span>`;
function stressChart(r){const v1=r.bal,v2=r.st,n=v1.length,W=700,H=220,L=44,B=24,T=14,lo=Math.min(0,...v2),hi=Math.max(...v1)*1.05,y=a=>T+(H-T-B)*(1-(a-lo)/(hi-lo)),x=i=>L+(W-L-8)*i/(n-1);
  let g="";for(let k=0;k<=4;k++){const a=lo+(hi-lo)*k/4;g+=`<line x1="${L}" x2="${W}" y1="${y(a)}" y2="${y(a)}" stroke="var(--line)"/><text x="${L-5}" y="${y(a)+4}" text-anchor="end">${(a/1e6).toFixed(0)}</text>`}
  g+=CUM.map((d,i)=>`<text x="${x(d)}" y="${H-7}">${MN[i]}</text>`).join("");
  const pl=(v,c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" points="${v.map((a,i)=>x(i).toFixed(1)+","+y(a).toFixed(1)).join(" ")}"/>`;
  g+=pl(v1,"var(--ok)",2)+pl(v2,"var(--bad)",2);
  const lx=x(r.iS),anc=lx>W-190?"end":"start";
  g+=`<circle cx="${lx}" cy="${y(r.minS)}" r="4.5" fill="var(--bad)"/><text x="${anc==="end"?lx-8:lx+8}" y="${y(r.minS)+4}" text-anchor="${anc}" style="fill:var(--bad)">минимум ${fm(r.minS)} млн, ${dlab(r.iS)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Остаток денег по дням: факт и при задержке страховых">${g}</svg>`}
function renderStress(){const scope=document.getElementById("st-scope").value,delay=+document.getElementById("st-delay").value,res=Math.max(0,+document.getElementById("st-res").value||0),
  r=stressCalc(scope,delay,res),same=r.iS===r.iF||Math.abs(r.minS-r.minF)<1;
  document.getElementById("st-delay-v").textContent=delay+" дн.";
  const bg=firstDelay(scope,res,x=>x.bad>x.badF),gp=firstDelay(scope,res,x=>x.gap>0);
  const mt=r.months.map((m,i)=>`<tr><td>${MN[i]}</td><td style="text-align:right">${fm(m.mf)}</td><td style="text-align:right">${fm(m.ms)}</td><td style="text-align:right">${m.ds.toFixed(1).replace(".",",")}</td><td>${stpill(m.sf)}</td><td>${stpill(m.ss)}</td></tr>`).join("");
  document.getElementById("st-out").innerHTML=`
  <div class="kpis"><div class="kpi"><div class="tag">Самый низкий дневной остаток при задержке</div><div class="big">${fm(r.minS)}<small> млн ₽</small></div><div class="kv"><span>Дата</span><span>${dlab(r.iS)}.2025</span><span>Факт (без задержки)</span><span>${fm(r.minF)}</span></div></div>
  <div class="kpi"><div class="tag">Запас в днях выплат, худший месяц</div><div class="big">${r.daysS.toFixed(1).replace(".",",")}</div><div class="kv"><span>Резерв</span><span>${res} дн.</span><span>Месяцев ниже резерва / с разрывом</span><span>${r.bad} / ${r.gap}</span></div></div>
  <div class="kpi"><div class="tag">Задержка, при которой появляется проблема</div><div class="big" style="font-size:24px">${bg===null?"не появляется":(bg===0?"уже в факте":bg+" дн.")}</div><div class="kv"><span>Первый месяц ниже резерва</span><span>${bg===null?"до 365 дн.":bg+" дн."}</span><span>Первый разрыв (остаток &lt; 0)</span><span>${gp===null?"до 365 дн.":gp+" дн."}</span></div></div></div>
  <div class="chart"><h3>Остаток по дням, млн ₽: факт и при задержке страховых на ${delay} дн.</h3><p class="legend"><span class="sw" style="background:var(--ok)"></span>факт<span class="sw" style="background:var(--bad)"></span>при задержке (${scope==="Все"?"вся сеть":scope})</p>${stressChart(r)}</div>
  ${same?`<div class="okbox">Самый низкий остаток года приходится на ${dlab(r.iF)}, до основных поступлений от страховых, поэтому задержка его не меняет. Влияние задержки видно в таблице по месяцам ниже: в запасе дней и остатках более поздних месяцев.</div>`:""}
  <div class="tw"><table><thead><tr><th>Месяц</th><th style="text-align:right">Минимум факт, млн ₽</th><th style="text-align:right">Минимум при задержке, млн ₽</th><th style="text-align:right">Запас при задержке, дней</th><th>Статус факт</th><th>Статус при задержке</th></tr></thead><tbody>${mt}</tbody></table></div>`}
function initStress(){["st-scope","st-delay","st-res"].forEach(id=>document.getElementById(id).addEventListener("input",renderStress));renderStress()}
const nav=document.getElementById("nav"),main=document.getElementById("main");
function show(id){
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  main.innerHTML=VIEW[id](); if(id==="cash")initStress(); location.hash=id;
}
TABS.forEach(([id,t])=>{const b=document.createElement("button");b.type="button";b.role="tab";b.dataset.id=id;b.textContent=t;b.onclick=()=>show(id);nav.appendChild(b)});
const start=TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):"quality";
show(start); addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEW[h])show(h)});
document.getElementById("theme").onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#14191f";r.dataset.theme=dark?"light":"dark"};
</script>
</body>
